<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Каталог для сотрудников — Travel Academy</title><link rel="stylesheet" href="assets/base.css"><link rel="stylesheet" href="assets/upgrade.css"><script defer src="assets/staff.js"></script></head><body><main class="document-page"><a href="./">← На сайт</a><h1>Управление предложениями</h1><form id="staff-login" class="request-form"><label>Ключ доступа<input id="staff-token" type="password" minlength="32" autocomplete="off" required></label><button class="btn-hero btn-fill" type="submit">Открыть каталог</button><p class="fine-print">Ключ действует только в этом окне и не сохраняется в браузере.</p></form><p id="staff-status" role="status"></p><section id="staff-work" hidden style="padding:0"><button id="staff-logout" class="btn-hero btn-outline">Выйти</button><label>Предложение<select id="staff-select"></select></label><button id="staff-new" class="btn-hero btn-outline">Добавить предложение</button><form id="staff-edit" class="request-form"><div class="field-grid"><label>Название<input name="name" required maxlength="200"></label><label>Страна<input name="country" required maxlength="80"></label><label>Регион<input name="region" maxlength="80"></label><label>Период для посетителя<input name="period" required maxlength="160"></label><label>Месяц<input name="month" type="number" min="1" max="12" required></label><label>Точная дата выезда<input name="departureDate" type="date"></label><label>Предложение действует до<input name="expiresAt" type="date"></label><label>Дата проверки цены<input name="priceCheckedAt" type="date"></label><label>Дата исходной публикации<input name="publicationISO" type="date" required></label><label>Цена, ₽<input name="amount" type="number" min="1"></label><label>Расчёт<select name="priceBasis"><option value="twoAdults">За 2 взрослых</option><option value="person">За человека</option><option value="request">По запросу</option></select></label><label>Формат цены<select name="priceKind"><option value="quote">Цена из публикации</option><option value="from">От указанной суммы</option></select></label><label>Статус<select name="status"><option value="draft">Черновик</option><option value="request">Подбор по запросу</option><option value="confirmed">Подтверждённое предложение</option><option value="archived">Архив</option></select></label><label>Тип отдыха<input name="kind" required></label><label>Номер / размещение<input name="room" required></label><label>Продолжительность<input name="duration" required></label><label>Питание<input name="meal" required></label><label>Город вылета<input name="departureCity"></label><label>Туроператор и номер реестра<input name="operator"></label><label>Менеджер<select name="manager"><option value="maria">Мария</option><option value="julia">Юлия</option></select></label></div><label>Краткое описание<textarea name="summary" rows="3" maxlength="1000"></textarea></label><label>Включено — по одному пункту в строке<textarea name="included" rows="3"></textarea></label><label>Доплаты / не включено<textarea name="excluded" rows="3"></textarea></label><label>Что нужно уточнить<textarea name="missing" rows="3"></textarea></label><label>Ссылка на источник<input name="sourceUrl" type="url" required></label><button type="submit" class="btn-hero btn-fill">Сохранить предложение</button><p class="fine-print">Одна запись — один отель, период, состав туристов и вариант размещения. Истёкшие предложения скрываются автоматически. До изменения создаётся резервная копия.</p></form></section></main></body></html>
